['Accounting equation',['Learn: Assets = Liabilities + Equity. Do: on paper list 5 items of each from your company (stock, bank, supplier balance, loan, owner capital). Check: does it balance?','Learn: how a sale changes the equation (cash up, income up). Do: write 6 transactions and show the effect on assets, liabilities and equity. Check: both sides stay equal.','Learn: income and expenses sit inside equity. Do: record rent paid, sales made and stock bought on credit and show equity after each.','Do: open the Practice Trading Co file in QuickBooks Desktop. Tap Reports > Company & Financial > Balance Sheet Standard. Find the assets, liabilities and equity totals and check they balance.','Quiz day: write the equation from memory, then 10 true/false questions on which side an item belongs. Write your mistakes in the Journal tab.']],

 if(D.length)h+='<p>Debits <b>'+td[0]+'</b> · Credits <b>'+td[1]+'</b> '+(td[0]===td[1]&&td[0]>0?'<span class="good">✅ balanced</span>':'<span class="red">❌ out by '+r2(Math.abs(td[0]-td[1]))+'</span>')+'</p><button class="p" data-glp="1">📮 Post entry</button>';

 tD=r2(tD);tC=r2(tC);
 if(P.length)h+='<p>Trial balance: Dr <b>'+tD+'</b> · Cr <b>'+tC+'</b> '+(tD===tC?'<span class="good">✅ agrees</span>':'<span class="red">❌ out</span>')+'</p><button data-glc="1">📋 Copy for Excel</button> <button data-glr="1">🗑️ Clear ledger</button><p class="small">Copy, then in Excel tap cell A1 and press Cmd+V. Save as General-Ledger.xlsx.</p>';

['Debit and credit, explained properly',`<h3>1. Why accounting has two sides</h3><p>Every deal has two sides. When you pay rent, you give money and you get the use of a shop. When you sell on credit, you give goods and you get a promise to be paid. Double entry means we record BOTH sides every time. This is a safety check: if the two sides do not match, we know there is a mistake.</p><h3>2. What the words mean</h3><p>Debit means the left side. Credit means the right side. That is all. They do not mean good or bad. They do not mean money in or money out. Every account is drawn as a T. The left of the T is debit. The right is credit.</p><pre class="dg">      ACCOUNT NAME
  Debit (left) | Credit (right)</pre><h3>3. Why each account goes up on a different side</h3><p>Start from the equation: Assets = Liabilities + Equity. Assets are on the LEFT of the equals sign. So assets go up on the left, with a debit. Liabilities and equity are on the RIGHT. So they go up on the right, with a credit.</p><p>Income makes equity grow, so income goes up with a credit, like equity. Expenses make equity smaller, so they are the opposite of equity. They go up with a debit. Drawings (the owner taking money out) also make equity smaller, so they go up with a debit.</p><div class="tw"><table class="t"><tr><th>Account type</th><th>Goes UP with</th><th>Goes DOWN with</th></tr><tr><td>Asset (Bank, Stock, A/R)</td><td>Debit</td><td>Credit</td></tr><tr><td>Expense (Rent, Salaries)</td><td>Debit</td><td>Credit</td></tr><tr><td>Drawings</td><td>Debit</td><td>Credit</td></tr><tr><td>Liability (A/P, Loan, VAT owed)</td><td>Credit</td><td>Debit</td></tr><tr><td>Equity (Capital)</td><td>Credit</td><td>Debit</td></tr><tr><td>Income (Sales)</td><td>Credit</td><td>Debit</td></tr></table></div><h3>4. The method for every deal</h3><ol><li>Say what happened in one sentence.</li><li>List the accounts that are touched. There are at least two.</li><li>For each account, write its type.</li><li>For each account, decide: does it go up or down?</li><li>Use the table: up or down on that type means debit or credit.</li><li>Check: total debits = total credits.</li></ol><h3>5. Six worked examples</h3><p><b>A. Owner puts 10,000 into the bank.</b> Bank is an asset and goes up: debit Bank 10,000. Capital is equity and goes up: credit Capital 10,000.</p><p><b>B. Buy stock 4,000 on credit.</b> Stock is an asset and goes up: debit Stock. We owe the supplier, so Accounts Payable (a liability) goes up: credit A/P. Bank is not touched because no money moved yet.</p><p><b>C. Pay the supplier 4,000.</b> We owe less, so A/P (liability) goes down: debit A/P. Bank (asset) goes down: credit Bank.</p><p><b>D. Sell on credit 1,000 plus 5% VAT.</b> Customers owe us 1,050, so A/R (asset) goes up: debit A/R 1,050. Sales (income) goes up: credit Sales 1,000. VAT is owed to the tax office, a liability that goes up: credit VAT 50.</p><p><b>E. Pay rent 2,500 from the bank.</b> Rent expense goes up: debit Rent. Bank goes down: credit Bank.</p><p><b>F. Owner takes 500 for himself.</b> Drawings go up: debit Drawings. Bank goes down: credit Bank.</p><h3>6. The five mistakes everyone makes</h3><ol><li><b>Using bank statement words.</b> Your bank says "credit" when money arrives. That is the bank's view. In YOUR books, cash arriving is a debit to Bank because Bank is your asset.</li><li><b>Copying the direction of the other line.</b> A/R and Sales are both increasing in a credit sale, but A/R is debited and Sales is credited. Each account follows its own type.</li><li><b>Adding Bank to a deal done on credit.</b> If no money moved, Bank is not in the entry.</li><li><b>Forgetting the VAT line.</b> VAT you pay is a debit. VAT you charge is a credit.</li><li><b>Mixing A/R and A/P.</b> A/R is money owed TO you (asset). A/P is money YOU owe (liability).</li></ol><h3>7. Test yourself</h3><ol><li>You pay 300 for electricity from the bank.</li><li>A customer pays an old invoice of 2,000.</li><li>You take a bank loan of 20,000.</li></ol><details><summary>Answers</summary><pre class="dg">1 Dr Electricity expense 300     Cr Bank 300
2 Dr Bank 2,000                  Cr A/R 2,000
3 Dr Bank 20,000                 Cr Loan 20,000</pre></details>`],
['From invoice to cash: the whole sales cycle',`<h3>1. The story</h3><p>You sell 10 bags of rice to a customer. The customer does not pay today. They will pay in 30 days. This is a credit sale. Four things happen over time: you invoice, the stock leaves, the customer pays, and you bank the money.</p><h3>2. Step 1: the invoice</h3><p>On the invoice day you earn the sale, even though no cash arrived. The customer now owes you money, so Accounts Receivable (an asset) goes up. Sales (income) goes up. The VAT you charged is not your income. It belongs to the tax office, so it is a liability.</p><pre class="dg">Invoice: 10 bags x 100 = 1,000 + VAT 5% = 1,050

Dr Accounts Receivable   1,050
   Cr Sales                 1,000
   Cr VAT Output               50</pre><h3>3. Step 2: the stock leaves</h3><p>You also lose 10 bags from the warehouse. They cost you 80 each. The cost of the goods you sold is an expense called Cost of Goods Sold (COGS). QuickBooks posts this by itself when the item is an Inventory Part.</p><pre class="dg">Dr Cost of Goods Sold    800
   Cr Stock                  800</pre><p>Now you can see your gross profit: Sales 1,000 minus COGS 800 = 200.</p><h3>4. Step 3: the customer pays</h3><p>Thirty days later the customer pays 1,050. The customer no longer owes you, so A/R goes down. Money arrives. In QuickBooks you first put the money into Undeposited Funds, a holding account, because it is not in the bank yet.</p><pre class="dg">Dr Undeposited Funds   1,050
   Cr Accounts Receivable  1,050</pre><h3>5. Step 4: the deposit</h3><p>You take the cash or cheque to the bank. Now it moves from the holding account into Bank.</p><pre class="dg">Dr Bank                1,050
   Cr Undeposited Funds    1,050</pre><h3>6. The result</h3><div class="tw"><table class="t"><tr><th>Account</th><th>Change</th></tr><tr><td>Bank</td><td>+1,050</td></tr><tr><td>Stock</td><td>-800</td></tr><tr><td>A/R</td><td>0 (up then down)</td></tr><tr><td>Sales</td><td>+1,000</td></tr><tr><td>COGS</td><td>-800 (expense)</td></tr><tr><td>VAT owed</td><td>+50</td></tr></table></div><p>Profit is 200. Cash is up 1,050 but 50 of it is VAT you must pay to the tax office, so only 1,000 minus the 800 cost is yours.</p><h3>7. What can go wrong</h3><ul><li><b>Customer never pays.</b> After a long time you write it off as a bad debt: Dr Bad debt expense, Cr A/R.</li><li><b>Customer returns goods.</b> You issue a credit note: Dr Sales returns, Dr VAT output, Cr A/R, and the stock goes back up.</li><li><b>Payment goes to the wrong invoice.</b> A/R Aging shows the wrong customer as late. Always tick the right invoice.</li></ul><h3>8. The check that proves it</h3><p>Open Reports > Customers and Receivables > A/R Aging Summary. The total must equal Accounts Receivable on the Balance Sheet. If it does not, stop and find the difference.</p><h3>9. Test yourself</h3><ol><li>Why is the VAT not part of Sales?</li><li>What account holds money received but not yet banked?</li><li>An invoice is 2,100 including 5% VAT. How much is Sales?</li></ol><details><summary>Answers</summary><p>1 VAT belongs to the tax office. It is a liability. 2 Undeposited Funds. 3 2,100 divided by 1.05 = 2,000.</p></details>`],
['Accruals and prepayments',`<h3>1. The big idea: match costs to the period</h3><p>A profit report for October must show the costs of October. It does not matter when you paid. This is called the matching principle. Two situations break the link between paying and using: you used something but have not paid yet (accrual), or you paid but have not used it yet (prepayment).</p><h3>2. Accrual: used, not yet paid</h3><p>It is 31 December. You used electricity in December but the bill arrives on 10 January. The cost belongs to December. So at 31 December you record it, and you also record that you owe it.</p><pre class="dg">31 Dec  Dr Electricity expense   600
           Cr Accrued expenses       600   (a liability)</pre><p>On 10 January you pay the bill of 600. You do NOT record the expense again. You clear the liability.</p><pre class="dg">10 Jan  Dr Accrued expenses      600
           Cr Bank                   600</pre><h3>3. Prepayment: paid, not yet used</h3><p>On 1 October you pay 1,200 for 12 months of insurance. By 31 December only 3 months are used. That is 300. The other 900 is still a benefit you own, so it is an asset called Prepayments.</p><pre class="dg">1 Oct   Dr Prepayments           1,200
           Cr Bank                  1,200

31 Dec  Dr Insurance expense       300
           Cr Prepayments            300
Prepayments left = 900 (asset on the Balance Sheet)</pre><h3>4. Income side</h3><p><b>Accrued income:</b> you earned it but have not invoiced yet. Dr Accrued income (asset), Cr Income. <b>Deferred income:</b> a customer paid you in advance. You owe them the service, so it is a liability until you do the work. Dr Bank, Cr Deferred income.</p><div class="tw"><table class="t"><tr><th>Name</th><th>Type</th><th>Meaning</th></tr><tr><td>Accrued expense</td><td>Liability</td><td>Cost used, not paid</td></tr><tr><td>Prepayment</td><td>Asset</td><td>Paid, not used</td></tr><tr><td>Accrued income</td><td>Asset</td><td>Earned, not invoiced</td></tr><tr><td>Deferred income</td><td>Liability</td><td>Received, not earned</td></tr></table></div><h3>5. In QuickBooks</h3><ol><li>Company > Make General Journal Entries.</li><li>Tick Adjusting Entry.</li><li>Enter the date as the last day of the month.</li><li>Debit the expense, credit the liability or prepayment account.</li><li>Tap Save and Close and check with Ctrl+Y.</li></ol><h3>6. Test yourself</h3><ol><li>Rent of 3,000 for January to March was paid on 1 January. Year end is 31 January. What is the expense and what is the prepayment?</li><li>Salaries of 5,000 for December are paid on 5 January. What is the entry on 31 December?</li></ol><details><summary>Answers</summary><p>1 Expense 1,000. Prepayment 2,000. 2 Dr Salaries expense 5,000, Cr Accrued expenses 5,000.</p></details>`],
['Depreciation',`<h3>1. Why we depreciate</h3><p>You buy a laptop for 4,000. It will help you earn money for 3 years. It would be wrong to say the whole 4,000 is a cost in the first month. So we spread the cost over the years it is used. This is depreciation. It is a way of matching the cost to the years that benefit.</p><h3>2. Straight-line method</h3><pre class="dg">Annual depreciation = (Cost - Residual value) / Useful life

Laptop: cost 4,000, residual value 400, life 3 years
(4,000 - 400) / 3 = 1,200 per year = 100 per month</pre><h3>3. The entry</h3><p>Each period you record the cost as an expense. You do NOT reduce the asset account directly. You credit a separate account called Accumulated Depreciation. It is a contra-asset: it sits with the assets but has a credit balance.</p><pre class="dg">Dr Depreciation expense           1,200
   Cr Accumulated depreciation      1,200</pre><h3>4. How it looks on the Balance Sheet</h3><pre class="dg">Laptop at cost                    4,000
Less accumulated depreciation    (1,200)   after year 1
Net book value                    2,800

After year 2: 4,000 - 2,400 = 1,600
After year 3: 4,000 - 3,600 = 400 (residual value)</pre><h3>5. Reducing balance method</h3><p>Some assets lose more value early on. You use a percentage of the net book value each year. With 25 percent: year 1 is 25% of 4,000 = 1,000. Net book value is 3,000. Year 2 is 25% of 3,000 = 750. Net book value is 2,250.</p><h3>6. Selling or scrapping an asset</h3><p>You sell the laptop after 2 years for 2,000. Net book value is 1,600. You sold it for more, so you made a gain of 400. Remove the cost and the accumulated depreciation, record the cash, and put the difference in a gain account.</p><pre class="dg">Dr Bank                      2,000
Dr Accumulated depreciation  2,400
   Cr Laptop (cost)            4,000
   Cr Gain on disposal           400</pre><h3>7. In QuickBooks</h3><ol><li>Lists > Chart of Accounts > Account > New.</li><li>Choose Fixed Asset. Name it Accumulated Depreciation.</li><li>Make a General Journal Entry each month: Dr Depreciation Expense, Cr Accumulated Depreciation.</li><li>Check on the Balance Sheet that the fixed asset shows cost less accumulated depreciation.</li></ol><h3>8. Test yourself</h3><ol><li>A machine costs 12,000, residual 2,000, life 5 years. Annual depreciation?</li><li>Net book value after 2 years?</li></ol><details><summary>Answers</summary><p>1 (12,000 - 2,000) / 5 = 2,000 per year. 2 12,000 - 4,000 = 8,000.</p></details><p>Land is not depreciated. Depreciation is not a cash payment. It is an accounting estimate.</p>`]];
